name: Deploy Frontend

on:
  push:
    branches: [deploy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest .
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:v1.0.0 .
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:${{ github.sha }} .

  push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:v1.0.0
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:${{ github.sha }}

  deploy:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 2222
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest
            docker stop casino-frontend || true
            docker rm casino-frontend || true
            docker run -d \
              --name casino-frontend \
              -p 80:8080 \
              -e EC2_BACKEND_HOST="${{ secrets.EC2_BACKEND_HOST }}" \
              -e NGINX_ENVSUBST_FILTER="EC2_BACKEND_HOST" \
              ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest

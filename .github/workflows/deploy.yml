name: Deploy Frontend

on:
  push:
    branches: [deploy]

jobs:
  pipeline-completo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Build Image (Etapa 1)
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest .

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image (Etapa 2)
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest

      - name: Deploy to AWS EC2 (Etapa 3)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 2222
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest
            docker stop casino-frontend || true
            docker rm casino-frontend || true
            docker run -d \
              --name casino-frontend \
              -p 80:8080 \
              -e EC2_BACKEND_HOST="${{ secrets.EC2_BACKEND_HOST }}" \
              -e NGINX_ENVSUBST_FILTER="EC2_BACKEND_HOST" \
              ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest
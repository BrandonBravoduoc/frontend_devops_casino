name: Deploy Frontend

on:
  push:
    branches: [deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:v1.0.0
            ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:${{ github.sha }}

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest
            docker stop casino-frontend || true
            docker rm casino-frontend || true
            docker run -d --name casino-frontend -p 80:8080 -e BACKEND_HOST=${{ secrets.BACKEND_HOST }} ${{ secrets.DOCKER_HUB_USERNAME }}/vidal-frontend:latest